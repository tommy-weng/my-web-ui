<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>联调测试</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 300px; margin: 0 auto; }
        input { display: block; width: 80%; margin: 10px auto; padding: 8px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ===== 彩色球区域 ===== */
        #ballStage { display: none; max-width: 480px; margin: 0 auto; }
        .balls { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
        .ball {
            width: 80px; height: 80px; border-radius: 50%;
            transition: transform .2s, box-shadow .2s, background-color .3s;
        }
        /* 焦点球：放大 + 白色描边 + 同色光晕 */
        .ball.focused {
            transform: scale(1.2);
            box-shadow: 0 0 0 4px #fff, 0 0 18px 6px currentColor;
        }
        #hint { margin-top: 50px; color: #666; }
    </style>
</head>
<body>

    <div class="card">
        <h3>系统登录</h3>
        <form onsubmit="doLogin(event)">
            <input type="text" id="user" placeholder="用户名" autofocus>
            <input type="password" id="pw" placeholder="密码">
            <button type="submit" id="loginBtn">登录</button>
            <p id="msg"></p>
        </form>
    </div>

    <!-- 登录成功后展示的三个彩色球 -->
    <div id="ballStage">
        <h3>🎉 登录成功，欢迎！</h3>
        <div class="balls">
            <div class="ball" id="ball0"></div>
            <div class="ball" id="ball1"></div>
            <div class="ball" id="ball2"></div>
        </div>
        <p id="hint">按 Enter 键：改变当前球的颜色，焦点自动切换到下一个球</p>
    </div>

    <script src="login.js"></script>
</body>
</html>
